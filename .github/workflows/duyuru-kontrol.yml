name: ÖSYM Duyuru Kontrolü

on:
  schedule:
    # 07:00 UTC = 10:00 Türkiye saati (TR, UTC+3, DST uygulamıyor)
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  check-announcements:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Duyuruları çek ve webhook'a gönder
        env:
          # Repo Settings > Secrets and variables > Actions içinde
          # ANNOUNCEMENT_WEBHOOK_URL tanımlıysa o kullanılır; tanımlı değilse
          # script kendi içindeki varsayılan webhook.site adresine düşer.
          WEBHOOK_URL: ${{ secrets.ANNOUNCEMENT_WEBHOOK_URL }}
        run: python scripts/check_announcements.py
